AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SuryaCheck - rooftop solar underperformance diagnosis (Environmental Hacks 2026)

Parameters:
  ModelVision:
    Type: String
    Default: in.anthropic.claude-haiku-4-5-20251001-v1:0
  ModelAgent:
    Type: String
    Default: in.anthropic.claude-haiku-4-5-20251001-v1:0
  DemoMode:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  DemoKey:
    Type: String
    NoEcho: true
  RecheckDelayMinutes:
    Type: String
    Default: "3"

Globals:
  Function:
    Architectures: [x86_64]
    Timeout: 25
    MemorySize: 512
    LoggingConfig:
      LogFormat: JSON
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: suryacheck
        TABLE_NAME: !Ref Table
        MODEL_VISION: !Ref ModelVision
        MODEL_AGENT: !Ref ModelAgent
        DEMO_MODE: !Ref DemoMode
        RECHECK_DELAY_MINUTES: !If [IsDemo, !Ref RecheckDelayMinutes, "0"]
        AGENT_FUNCTION_ARN: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:suryacheck-agent
        SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn

Conditions:
  IsDemo: !Equals [!Ref DemoMode, "true"]

Resources:
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: GSI1PK, AttributeType: S }
        - { AttributeName: GSI1SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - { AttributeName: GSI1PK, KeyType: HASH }
            - { AttributeName: GSI1SK, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  UploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - { Id: expire-screenshots, Status: Enabled, ExpirationInDays: 7 }
      CorsConfiguration:
        CorsRules:
          - { AllowedMethods: [POST], AllowedOrigins: ["*"], AllowedHeaders: ["*"], MaxAge: 3000 }

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET, POST, PUT, OPTIONS]
        AllowHeaders: [content-type, x-demo-key, authorization]
      Auth:
        Authorizers:
          Cognito:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      RouteSettings:
        "POST /sites": { ThrottlingBurstLimit: 2, ThrottlingRateLimit: 1 }
        "POST /sites/{site_id}/extractions": { ThrottlingBurstLimit: 3, ThrottlingRateLimit: 1 }
        "POST /sites/{site_id}/analyses": { ThrottlingBurstLimit: 3, ThrottlingRateLimit: 1 }

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: api.app.handler
      Runtime: python3.13
      Timeout: 29
      Environment:
        Variables:
          BUCKET_NAME: !Ref UploadBucket
          AGENT_FUNCTION: !Ref AgentFunction
          DEMO_KEY: !Ref DemoKey
      Policies:
        - Statement:
            - Effect: Allow
              Action: [scheduler:CreateSchedule]
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/recheck-*
            - Effect: Allow
              Action: [iam:PassRole]
              Resource: !GetAtt SchedulerRole.Arn
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - S3CrudPolicy: { BucketName: !Ref UploadBucket }
        - LambdaInvokePolicy: { FunctionName: !Ref AgentFunction }
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:Converse, textract:DetectDocumentText, textract:AnalyzeDocument]
              Resource: "*"
      Events:
        Health:        { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /health, Method: GET } }
        CreateSite:    { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /sites, Method: POST } }
        GetSite:       { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}", Method: GET } }
        Uploads:       { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/uploads", Method: POST } }
        Extractions:   { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/extractions", Method: POST } }
        Readings:      { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/readings", Method: PUT } }
        MeterReading:  { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/meter", Method: POST } }
        SiteEvents:    { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/events", Method: POST } }
        StartAnalysis: { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/analyses", Method: POST } }
        ListAnalyses:  { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/analyses", Method: GET } }
        Me:            { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /me, Method: GET, Auth: { Authorizer: Cognito } } }
        SaveMySite:    { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: /me/site, Method: PUT, Auth: { Authorizer: Cognito } } }
        GetAnalysis:   { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/analyses/{analysis_id}", Method: GET } }
        CreateAction:  { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/actions", Method: POST } }
        DemoRecheck:   { Type: HttpApi, Properties: { ApiId: !Ref HttpApi, Path: "/sites/{site_id}/actions/{action_id}/recheck", Method: POST } }

  AgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: suryacheck-agent
      PackageType: Image
      Timeout: 120
      MemorySize: 1536
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref Table }
        - Statement:
            - Effect: Allow
              Action: [scheduler:CreateSchedule]
              Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/recheck-*
            - Effect: Allow
              Action: [iam:PassRole]
              Resource: !GetAtt SchedulerRole.Arn
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream, bedrock:Converse, bedrock:ConverseStream]
              Resource: "*"
    Metadata:
      DockerContext: ./backend
      Dockerfile: agent/Dockerfile
      DockerTag: python3.13-v1

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition: { StringEquals: { aws:SourceAccount: !Ref AWS::AccountId } }
      Policies:
        - PolicyName: invoke-agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:suryacheck-agent

  AgentLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AgentFunction}
      RetentionInDays: 7

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${ApiFunction}
      RetentionInDays: 7

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: suryacheck-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Policies:
        PasswordPolicy: { MinimumLength: 8, RequireLowercase: true, RequireNumbers: true, RequireUppercase: false, RequireSymbols: false }
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your SuryaCheck code
        EmailMessage: "Your SuryaCheck verification code is {####}"

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: suryacheck-web
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]   # admin flow: IAM-only, used by scripts/e2e_auth.py
      PreventUserExistenceErrors: ENABLED

Outputs:
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  TableName:
    Value: !Ref Table
  BucketName:
    Value: !Ref UploadBucket
